[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rescuelink"
version = "1.0.0"
description = "Adaptive reliable emergency network over the original course Cable"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["rescuelink*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["unit: isolated codec and state tests", "integration: end-to-end protocol", "physical_channel: original teacher Cable"]
